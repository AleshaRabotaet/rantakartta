# Витрины для обхода. Ключ = source в id объектов.
# section_paths: URL раздела(ов) жилья — один или несколько, обход идёт через googlesitemap.xml
#   витрины (устойчивее парсинга ссылок с одной страницы). Часть Johku-витрин заводит объекты
#   только на fi_FI и не переводит на en_US — такие fi_FI-only разделы дописываются отдельным
#   URL в этом же списке, парсер понимает финские метки наравне с английскими (issue #6).
# merchants: точки хозяев (ключ = префикс slug до первого "-"), нужны, когда у объекта нет адреса с улицей.
# area: запасная точка — центр муниципалитета.

