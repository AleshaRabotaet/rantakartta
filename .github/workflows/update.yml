name: Update data and deploy map

on:
  schedule:
    - cron: "0 4 * * 1"   # по понедельникам 04:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  update:
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m stays.build
      - name: Commit data
        run: |
          git config user.name "rantakartta-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data web/data.js
          git diff --cached --quiet || git commit -m "data: weekly update"
          git push

  deploy:
    needs: [update]
    if: github.event_name != 'pull_request' && always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - uses: actions/deploy-pages@v4
