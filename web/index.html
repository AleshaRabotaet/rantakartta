<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rantakartta: lakeside stays in Finland</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛶</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;700&family=Sofia+Sans+Condensed:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<style>
:root {
  --lake: #16324a;     /* глубокая вода: текст, виллы */
  --water: #dce7ec;    /* мелководье: фоны */
  --birch: #fafbf9;    /* берёза: панель */
  --pine: #2e5a45;     /* сосна: коттеджи */
  --berry: #c23a4b;    /* брусника: выделение */
  --granite: #5f6b75;  /* гранит: второстепенный текст */
  --line: #d5dde1;
  --t-villa: #16324a; --t-cottage: #2e5a45; --t-room: #7b4a86;
  --t-hut: #8a5f2c; --t-glamping: #2f7684; --t-camping: #5b6a26;
  --sans: "Sofia Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cond: "Sofia Sans Condensed", "Arial Narrow", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 16px/1.45 var(--sans); color: var(--lake); background: var(--water); }
.app { display: grid; grid-template-columns: 380px 1fr; height: 100%; }
#map { height: 100%; background: var(--water); }

/* ---------- панель ---------- */
.panel { background: var(--birch); display: flex; flex-direction: column; min-height: 0;
  border-right: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.head { padding: 22px 22px 14px; }
h1 { font: 800 34px/1 var(--cond); letter-spacing: -0.01em; margin: 0 0 6px; }
.lede { margin: 0; color: var(--granite); font-size: 15px; max-width: 34ch; }
.langs { display: flex; gap: 6px; margin-top: 12px; }
.filters { padding: 4px 22px 16px; display: grid; gap: 14px; border-bottom: 1px solid var(--line); }
.search { width: 100%; font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: inherit; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 14px/1 var(--sans); padding: 7px 11px; border-radius: 999px; cursor: pointer;
  border: 1.5px solid var(--line); background: #fff; color: var(--lake); display: inline-flex; gap: 6px; align-items: center; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; }
.chip .n { color: var(--granite); font-size: 12px; }
.chip[aria-pressed="true"] { border-color: var(--lake); background: var(--lake); color: #fff; }
.chip[aria-pressed="true"] .n { color: #c9d6de; }
.row { display: flex; align-items: center; gap: 12px; font-size: 14px; }
.row label { flex: none; color: var(--granite); }
.row input[type=range] { flex: 1; accent-color: var(--lake); }
.row output { font: 800 18px/1 var(--cond); min-width: 56px; text-align: right; }
.toggle { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--granite); cursor: pointer; }
.toggle input { accent-color: var(--lake); width: 16px; height: 16px; }
:focus-visible { outline: 2.5px solid var(--berry); outline-offset: 2px; }

.count { padding: 12px 22px 6px; font-size: 14px; color: var(--granite); display: flex; justify-content: space-between; }
.list { list-style: none; margin: 0; padding: 0 12px 16px; overflow-y: auto; flex: 1; min-height: 0;
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.item { display: grid; grid-template-columns: 6px 1fr auto; gap: 12px; padding: 11px 10px; border-radius: 8px; cursor: pointer; }
.item:hover, .item.active { background: var(--water); }
.item .bar { border-radius: 3px; }
.item .t { font-weight: 700; line-height: 1.2; }
.item .m { font-size: 13px; color: var(--granite); }
.item .p { font: 800 20px/1 var(--cond); align-self: center; white-space: nowrap; }
.item .p small { font: 500 12px var(--sans); color: var(--granite); margin-right: 2px; }
.empty { padding: 24px 22px; color: var(--granite); }
.empty button { font: inherit; color: var(--berry); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }

/* ---------- маркеры ---------- */
.pill-icon { background: none; border: 0; }
.pill { font: 800 15px/1 var(--cond); color: #fff; padding: 5px 8px 4px; border-radius: 999px; white-space: nowrap;
  box-shadow: 0 1px 3px rgba(22,50,74,.35); border: 2px solid #fff; transform: translate(-50%, -50%);
  position: absolute; left: 0; top: 0; transition: transform .12s; }
.pill.approx { border-style: dashed; }
.pill.active { background: var(--berry) !important; transform: translate(-50%, -50%) scale(1.18); z-index: 1000; }
.cluster { background: none; }
.cluster div { width: 100%; height: 100%; border-radius: 50%; background: var(--lake); color: #fff; border: 3px solid #fff;
  box-shadow: 0 1px 4px rgba(22,50,74,.4); display: grid; place-content: center; text-align: center; }
.cluster b { font: 800 18px/1 var(--cond); }
.cluster span { font: 500 10px/1.1 var(--sans); opacity: .85; }

.leaflet-popup-content-wrapper { border-radius: 10px; }
.leaflet-popup-content { margin: 14px 16px; font: 15px/1.4 var(--sans); color: var(--lake); min-width: 220px; }
.pop h3 { font: 800 22px/1.05 var(--cond); margin: 0 0 4px; }
.pop .m { color: var(--granite); font-size: 13px; margin-bottom: 10px; }
.pop .tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
.pop .tag { font-size: 12px; background: var(--water); padding: 3px 7px; border-radius: 4px; }
.pop .note { font-size: 12px; color: var(--berry); margin: 6px 0 0; }
.pop .go { display: block; text-align: center; margin-top: 12px; padding: 9px; border-radius: 8px;
  background: var(--lake); color: #fff !important; text-decoration: none; font-weight: 700; }
.pop .report { margin-top: 10px; font-size: 12px; }
.pop .report summary { color: var(--granite); cursor: pointer; text-align: center; }
.pop .report[open] summary { margin-bottom: 6px; }
.pop .report-form { display: grid; gap: 6px; }
.pop .report-form textarea { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; resize: vertical; color: inherit; }
.pop .report-form .hp { position: absolute; left: -9999px; }
.pop .report-form button { font: 600 13px var(--sans); padding: 6px; border: 1px solid var(--line); border-radius: 6px;
  background: #fff; color: var(--lake); cursor: pointer; }
.pop .report-form button:disabled { opacity: .6; cursor: default; }
.pop .report-status { margin: 0; font-size: 12px; color: var(--granite); min-height: 14px; }
.pop .report-status.err { color: var(--berry); }
.pop .price { font: 800 20px var(--cond); }

/* ---------- мобильный ---------- */
.sheet-toggle { display: none; }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  #map { grid-row: 1; }
  .panel { grid-row: 2; max-height: 38vh; border-right: 0; border-top: 1px solid var(--line); padding-top: 0;
    transition: max-height .2s; }
  .panel.open { max-height: 82vh; }
  .panel { overflow-y: auto; }
  .list { overflow: visible; flex: none; }
  .sheet-toggle { display: block; width: 100%; border: 0; background: none; padding: 8px 0 0; cursor: pointer; }
  .sheet-toggle::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto; }
  .head { padding: 8px 18px 10px; }
  h1 { font-size: 26px; }
  .lede { display: none; }
  .filters { padding: 0 18px 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="panel" id="panel">
    <button class="sheet-toggle" id="sheetToggle" aria-label="Expand list"></button>
    <div class="head">
      <h1>Rantakartta</h1>
      <p class="lede" id="lede">Stays with small hosts on Finnish lakes. Booking is on the host's own site.</p>
      <div class="langs" id="langs" role="group" aria-label="Language">
        <button class="chip" data-lang="fi" aria-pressed="false">FI</button>
        <button class="chip" data-lang="sv" aria-pressed="false">SV</button>
        <button class="chip" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <div class="filters">
      <input class="search" id="q" type="search" placeholder="Name or host" aria-label="Search">
      <div class="chips" id="types" role="group" aria-label="Accommodation type"></div>
      <div class="row">
        <label for="price" id="priceLabel">Up to</label>
        <input id="price" type="range" min="20" max="350" step="10" value="350">
        <output id="priceOut" for="price">€350</output>
      </div>
      <div class="chips" id="tags" role="group" aria-label="Amenities"></div>
      <label class="toggle"><input type="checkbox" id="exact"> <span id="exactLabel">Exact addresses only</span></label>
    </div>
    <div class="count"><span id="count"></span><span id="updated"></span></div>
    <ul class="list" id="list"></ul>
  </aside>
  <div id="map" role="region" aria-label="Map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="data.js"></script>
<script>
const GOATCOUNTER_CODE = "rantakartta"; // https://rantakartta.goatcounter.com/

(() => {
  const s = document.createElement("script");
  s.async = true;
  s.src = "//gc.zgo.at/count.js";
  s.dataset.goatcounter = `https://${GOATCOUNTER_CODE}.goatcounter.com/count`;
  document.head.appendChild(s);
})();

// ---------- i18n (issue #16): словарь строк, без ru — см. docs/decisions.md ----------
const SUPPORTED_LANGS = ["fi", "sv", "en"];
const LANG_KEY = "rantakartta:lang";
const STRINGS = {

    "types.room": "Room / B&B",
    "types.hut": "Hut",

    "types.camping": "Tent / camper",
    "tags.sauna": "Sauna",
    "tags.shore_sauna": "Lakeside sauna",

    "tags.pets": "Pets allowed",

    searchPlaceholder: "Nimi tai isäntä",
    searchAria: "Haku",
    typesAria: "Majoitustyyppi",
    priceUpTo: "Enintään",
    tagsAria: "Varustelu",
    exactOnly: "Vain tarkat osoitteet",
    mapAria: "Kartta",
    sheetToggleAria: "Laajenna luettelo",
    langAria: "Kieli",
    "types.villa": "Huvila",
    "types.cottage": "Mökki",

    "types.hut": "Hökkeli",

    resetFilters: "Nollaa suodattimet",

  },
  sv: {
    pageTitle: "Rantakartta: strandboende i Finland",
    lede: "Boende hos små värdar vid finska sjöar. Bokning direkt på värdens webbplats.",
    searchPlaceholder: "Namn eller värd",
    searchAria: "Sök",

    priceUpTo: "Upp till",

    "types.glamping": "Glamping",

    "precision.area": "Ungefärlig plats: endast området visas.",

    reportSending: "Skickar…",
    reportSuccess: "Tack, kartans ansvarige har meddelats.",
    reportError: "Det gick inte att skicka. Försök igen senare.",
    countOfTotal: "{shown} av {total}",

    resetFilters: "Återställ filter",
    dataAsOf: "data från {date}",

};

function t(key, vars) {
  let s = STRINGS[lang]?.[key] ?? STRINGS.en[key] ?? key;
  if (vars) for (const [k, v] of Object.entries(vars)) s = s.replace(`{${k}}`, v);
  return s;
}

function getStoredLang() {
  try { return localStorage.getItem(LANG_KEY); } catch { return null; }
}
function setStoredLang(l) {
  try { localStorage.setItem(LANG_KEY, l); } catch { /* приватный режим браузера */ }
}

function detectLang() {
  const hashLang = new URLSearchParams(location.hash.slice(1)).get("lang");
  if (SUPPORTED_LANGS.includes(hashLang)) return hashLang;
  const stored = getStoredLang();
  if (SUPPORTED_LANGS.includes(stored)) return stored;
  for (const l of navigator.languages || [navigator.language]) {
    const primary = (l || "").slice(0, 2).toLowerCase();
    if (SUPPORTED_LANGS.includes(primary)) return primary;
  }
  return "en";
}

let lang = detectLang();

const TYPE_COLORS = {
  villa: "var(--t-villa)",
  cottage: "var(--t-cottage)",
  room: "var(--t-room)",
  hut: "var(--t-hut)",
  glamping: "var(--t-glamping)",
  camping: "var(--t-camping)",
};
const TYPE_KEYS = Object.keys(TYPE_COLORS);
const TAG_KEYS = ["sauna", "shore_sauna", "lake", "pets"];
const PRECISION_NOTE_KEYS = ["merchant", "area"];
// Бэкенд на Netlify Functions создаёт GitHub Issue от своего имени — см. docs/decisions.md.
const REPORT_ENDPOINT = "https://rantakartta.netlify.app/.netlify/functions/report-issue";
const MAX_REPORT_LENGTH = 500;

const data = (window.LISTINGS || []).filter(d => d.lat != null);
const DEFAULT_MAX_PRICE = 350;
const state = { q: "", types: new Set(), tags: new Set(), maxPrice: DEFAULT_MAX_PRICE, exact: false, active: null };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const eur = n => n == null ? "?" : "€" + Math.round(n);

function track(path, title) {
  try {
    window.goatcounter?.count({ path, title, event: true });
  } catch (e) { /* блокировщик рекламы или скрипт не загрузился */ }
}

// ---------- карта ----------
const map = L.map("map", { zoomControl: true, preferCanvas: false }).setView([61.5, 28.1], 9);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>',
}).addTo(map);

const cluster = L.markerClusterGroup({
  showCoverageOnHover: false, maxClusterRadius: 45, spiderfyOnMaxZoom: true,
  iconCreateFunction(c) {
    const kids = c.getAllChildMarkers();
    const min = Math.min(...kids.map(m => m.options.item.price_from ?? Infinity));
    const size = kids.length > 9 ? 58 : 50;
    return L.divIcon({
      className: "cluster", iconSize: [size, size],
      html: `<div><b>${kids.length}</b><span>${t("from")} ${eur(min)}</span></div>`,
    });
  },
});
map.addLayer(cluster);

const markers = new Map();
for (const d of data) {
  const m = L.marker([d.lat, d.lon], { item: d, icon: pillIcon(d, false), keyboard: true, title: d.title });
  m.bindPopup(() => popup(d), { maxWidth: 280 });
  m.on("popupopen", () => select(d.id, false));
  markers.set(d.id, m);
}

function pillIcon(d, active) {
  const cls = ["pill", d.precision !== "exact" ? "approx" : "", active ? "active" : ""].join(" ");
  return L.divIcon({
    className: "pill-icon", iconSize: [0, 0], popupAnchor: [0, -16],
    html: `<div class="${cls}" style="background:${TYPE_COLORS[d.type] || "var(--lake)"}">${eur(d.price_from)}</div>`,
  });
}

function popup(d) {
  const tags = (d.tags || []).filter(tag => TAG_KEYS.includes(tag)).map(tag => `<span class="tag">${t("tags." + tag)}</span>`).join("");
  return `<div class="pop">
    <h3>${esc(d.title)}</h3>
    <div class="m">${esc(d.merchant)}</div>
    <div><span class="price">${t("from")} ${eur(d.price_from)}</span> ${t("perNight")}${d.beds ? t("bedsCount", { n: d.beds }) : ""}</div>
    <div class="m">${TYPE_KEYS.includes(d.type) ? t("types." + d.type) : ""}</div>
    ${tags ? `<div class="tags">${tags}</div>` : ""}
    ${PRECISION_NOTE_KEYS.includes(d.precision) ? `<p class="note">${t("precision." + d.precision)}</p>` : ""}
    <a class="go" href="${esc(d.url)}" target="_blank" rel="noopener">${t("openAtHost")}</a>
    <details class="report">
      <summary>${t("reportSummary")}</summary>
      <form class="report-form" data-id="${esc(d.id)}">
        <textarea name="message" rows="2" maxlength="${MAX_REPORT_LENGTH}" placeholder="${esc(t("reportPlaceholder"))}" required></textarea>
        <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off">
        <button type="submit">${t("reportSubmit")}</button>
        <p class="report-status"></p>
      </form>
    </details>
  </div>`;
}

function applyLanguage() {
  document.documentElement.lang = lang;
  document.title = t("pageTitle");
  $("lede").textContent = t("lede");
  $("q").placeholder = t("searchPlaceholder");
  $("q").setAttribute("aria-label", t("searchAria"));
  $("types").setAttribute("aria-label", t("typesAria"));
  $("priceLabel").textContent = t("priceUpTo");
  $("tags").setAttribute("aria-label", t("tagsAria"));
  $("exactLabel").textContent = t("exactOnly");
  $("map").setAttribute("aria-label", t("mapAria"));
  $("sheetToggle").setAttribute("aria-label", t("sheetToggleAria"));
  $("langs").setAttribute("aria-label", t("langAria"));
  document.querySelectorAll("#langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  if (window.LISTINGS_UPDATED) {
    $("updated").textContent = t("dataAsOf", { date: window.LISTINGS_UPDATED.split("-").reverse().join(".") });
  }
}

// ---------- фильтры ----------
function matches(d, skip) {
  if (skip !== "types" && state.types.size && !state.types.has(d.type)) return false;
  if (skip !== "tags") for (const tg of state.tags) if (!(d.tags || []).includes(tg)) return false;
  if (d.price_from != null && d.price_from > state.maxPrice) return false;
  if (state.exact && d.precision !== "exact") return false;
  if (state.q) {
    const hay = `${d.title} ${d.merchant}`.toLowerCase();
    if (!hay.includes(state.q)) return false;
  }
  return true;
}

function renderChips(el, keys, set, key, counter, labelFn, colorMap) {
  el.innerHTML = "";
  for (const k of keys) {
    const n = counter(k);
    if (!n && !set.has(k)) continue;
    const color = colorMap ? colorMap[k] : null;
    const b = document.createElement("button");
    b.className = "chip";
    b.setAttribute("aria-pressed", set.has(k));
    b.innerHTML = (color ? `<span class="dot" style="background:${color}"></span>` : "") +
      `${esc(labelFn(k))} <span class="n">${n}</span>`;
    b.onclick = () => {
      if (set.has(k)) { set.delete(k); } else { set.add(k); track(`/filter/${key}/${k}`, `Filter: ${key}=${k}`); }
      render();
    };
    el.appendChild(b);
  }
  if (!el.children.length) el.style.display = "none"; else el.style.display = "";
}

function render(fit) {
  const shown = data.filter(d => matches(d));
  renderChips($("types"), TYPE_KEYS, state.types, "types", tk => data.filter(d => d.type === tk && matches(d, "types")).length, k => t("types." + k), TYPE_COLORS);
  renderChips($("tags"), TAG_KEYS, state.tags, "tags", tk => data.filter(d => (d.tags || []).includes(tk) && matches(d, "tags")).length, k => t("tags." + k));

  cluster.clearLayers();
  cluster.addLayers(shown.map(d => markers.get(d.id)));
  if (fit && shown.length) map.fitBounds(L.latLngBounds(shown.map(d => [d.lat, d.lon])).pad(0.15));

  $("count").textContent = t("countOfTotal", { shown: shown.length, total: data.length });
  syncHash();
  const list = $("list");
  if (!shown.length) {
    list.innerHTML = `<li class="empty">${t("emptyMessage")} <button id="reset">${t("resetFilters")}</button></li>`;
    $("reset").onclick = reset;
    return;
  }
  list.innerHTML = shown.sort((a, b) => (a.price_from ?? 1e9) - (b.price_from ?? 1e9)).map(d => `
    <li class="item${state.active === d.id ? " active" : ""}" data-id="${esc(d.id)}" tabindex="0">
      <span class="bar" style="background:${TYPE_COLORS[d.type]}"></span>
      <div><div class="t">${esc(d.title)}</div><div class="m">${esc(d.merchant)}</div></div>
      <div class="p"><small>${t("from")}</small>${eur(d.price_from)}</div>
    </li>`).join("");
}

function setActive(m, on) {
  m.options.icon = pillIcon(m.options.item, on);   // для следующего появления маркера
  const el = m.getElement();                        // если маркер сейчас на карте
  if (el) el.querySelector(".pill")?.classList.toggle("active", on);
}

function select(id, open = true) {
  if (state.active && markers.has(state.active)) {
    setActive(markers.get(state.active), false);
  }
  state.active = id;
  const m = markers.get(id);
  setActive(m, true);
  document.querySelectorAll(".item").forEach(li => li.classList.toggle("active", li.dataset.id === id));
  if (open) cluster.zoomToShowLayer(m, () => m.openPopup());
  syncHash();
}

function reset() {
  state.q = ""; state.types.clear(); state.tags.clear(); state.maxPrice = DEFAULT_MAX_PRICE; state.exact = false;
  $("q").value = ""; $("price").value = DEFAULT_MAX_PRICE; $("priceOut").textContent = eur(DEFAULT_MAX_PRICE); $("exact").checked = false;
  render(true);
}

// ---------- ссылка (hash отражает язык, фильтры и выбранный объект) ----------
function hashToState() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has("q")) state.q = p.get("q").trim().toLowerCase();
  for (const tp of (p.get("type") || "").split(",")) if (TYPE_KEYS.includes(tp)) state.types.add(tp);
  for (const tg of (p.get("tags") || "").split(",")) if (TAG_KEYS.includes(tg)) state.tags.add(tg);
  if (p.has("max")) {
    const n = +p.get("max");
    if (Number.isFinite(n)) state.maxPrice = Math.min(Math.max(n, +$("price").min), +$("price").max);
  }
  if (p.get("exact") === "1") state.exact = true;
  const id = p.get("id");
  return id && markers.has(id) ? id : null;
}

function syncHash() {
  const p = new URLSearchParams();
  p.set("lang", lang);
  if (state.q) p.set("q", state.q);
  if (state.types.size) p.set("type", [...state.types].join(","));
  if (state.tags.size) p.set("tags", [...state.tags].join(","));
  if (state.maxPrice !== DEFAULT_MAX_PRICE) p.set("max", state.maxPrice);
  if (state.exact) p.set("exact", "1");
  if (state.active) p.set("id", state.active);
  history.replaceState(null, "", `#${p.toString()}`);
}

async function submitReport(form) {
  if (form.website.value) return; // honeypot: боты заполняют скрытое поле
  const item = markers.get(form.dataset.id)?.options.item;
  const message = form.message.value.trim();
  if (!item || !message) return;
  const status = form.querySelector(".report-status");
  const btn = form.querySelector("button");
  btn.disabled = true;
  status.className = "report-status";
  status.textContent = t("reportSending");
  try {
    const res = await fetch(REPORT_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: item.id, title: item.title, url: item.url, lat: item.lat, lon: item.lon, message }),
    });
    if (!res.ok) throw new Error();
    status.textContent = t("reportSuccess");
    form.reset();
  } catch {
    status.className = "report-status err";
    status.textContent = t("reportError");
    btn.disabled = false;
  }
}

$("list").addEventListener("click", e => {
  const li = e.target.closest(".item");
  if (li) { track(`/select/${li.dataset.id}`, "List select"); select(li.dataset.id); }
});
$("list").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const li = e.target.closest(".item");
  if (li) { track(`/select/${li.dataset.id}`, "List select"); select(li.dataset.id); }
});
document.addEventListener("click", e => {
  if (e.target.closest(".pop .go") && state.active) {
    track(`/click/open-host/${state.active}`, "Open at host");
  }
});
$("q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); render(); });
$("price").addEventListener("input", e => { state.maxPrice = +e.target.value; $("priceOut").textContent = eur(state.maxPrice); render(); });
$("exact").addEventListener("change", e => { state.exact = e.target.checked; render(); });
document.addEventListener("submit", e => {
  const form = e.target.closest(".report-form");
  if (!form) return;
  e.preventDefault();
  submitReport(form);
});
$("sheetToggle").addEventListener("click", () => $("panel").classList.toggle("open"));
document.querySelectorAll("#langs button").forEach(b => {
  b.addEventListener("click", () => {
    if (b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    setStoredLang(lang);
    track(`/lang/${lang}`, `Language: ${lang}`);
    applyLanguage();
    render();
  });
});
map.on("popupclose", () => { if (state.active) { setActive(markers.get(state.active), false); state.active = null; syncHash(); } });

applyLanguage();
const initialId = hashToState();
$("q").value = state.q;
$("price").value = state.maxPrice; $("priceOut").textContent = eur(state.maxPrice);
$("exact").checked = state.exact;
render(true);
if (initialId) select(initialId);
</script>
</body>
</html>
